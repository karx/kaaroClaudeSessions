name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: npm test

  package:
    name: Package Dry Run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate package metadata
        run: npm pkg get name version license engines bin files

      - name: Check npm package contents
        run: npm run package:check

      - name: Build npm artifact
        run: npm run release:pack

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaaro-sessions-npm
          path: kaaro-sessions-*.tgz
          if-no-files-found: error
          retention-days: 30

  distribution-manifests:
    name: Distribution Manifest Guardrails
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm manifest templates exist
        run: |
          test -f packaging/winget/Karx.kaaroSessions.yaml
          test -f packaging/homebrew/kaaro-sessions.rb

      - name: Keep release placeholders out of release-ready manifests
        run: |
          if grep -R "TODO_RELEASE" packaging/winget packaging/homebrew; then
            echo "Distribution manifests still contain release placeholders. Fill them before treating this as release-ready."
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')
